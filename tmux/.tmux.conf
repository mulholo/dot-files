# Set prefix to Ctrl-Space, not Ctrl-b
unbind-key C-b
set -g prefix C-Space

# Send new prefix through to other programs e.g. vim
bind C-Space send-prefix

# Reload with new settings on prefix-r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Reduce time tmux waits before waiting for another key to be pressed after ESC
# This allows vim to hit NORMAL mode in a reasonable time
set-option -sg escape-time 10

# Scroll with mouse
set -g mouse on

# Increase number of lines we can scroll back
set-option -g history-limit 5000

set-option -g status-position bottom

# Map splits to match vim
bind s split-window -h
bind i split-window -v

# Map window navigation to match vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resizing with vim-like commands
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable 256 colors and italics
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ',xterm-256color:Tc'

# Set activity alerts appropriately
set -g monitor-activity off
set -g visual-activity on

# Status bar
set -g status-left '#[fg=#eee8d5,bg=#073642] [#S] '
set -g status-right '#[fg=#eee8d5,bg=#073642] %Y-%m-%d %H:%M '

# ==========================================================
# PLUGINS
# ==========================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-copycat'

# ==========================================================
# CUSTOM THEME - SOLARIZED DARK
# https://ethanschoonover.com/solarized/
# ==========================================================

# base03: #002b36  base02: #073642  base01: #586e75
# base00: #657b83  base0: #839496   base1: #93a1a1
# base2: #eee8d5   base3: #fdf6e3
# yellow: #b58900  orange: #cb4b16  red: #dc322f
# magenta: #d33682  violet: #6c71c4  blue: #268bd2
# cyan: #2aa198    green: #859900

# Status bar
set -g status-style 'bg=#002b36,fg=#839496'

# Window status
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '
set -g window-status-style 'bg=#002b36,fg=#586e75'
set -g window-status-current-style 'bg=#002b36,fg=#268bd2,bold'
set -g window-status-activity-style 'bg=#002b36,fg=#b58900'
set -g window-status-bell-style 'bg=#dc322f,fg=#eee8d5'

# Pane borders
set -g pane-border-style 'fg=#073642'
set -g pane-active-border-style 'fg=#268bd2'

# Message text
set -g message-style 'bg=#268bd2,fg=#eee8d5'
set -g message-command-style 'bg=#002b36,fg=#268bd2'

# Pane number display
set -g display-panes-active-colour '#268bd2'
set -g display-panes-colour '#586e75'

# Clock mode
set -g clock-mode-colour '#268bd2'

# Copy mode
set -g mode-style 'bg=#073642,fg=#eee8d5'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
